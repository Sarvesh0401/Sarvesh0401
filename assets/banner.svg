<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078d4" />
      <stop offset="100%" stop-color="#00bcff" />
    </linearGradient>

    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ffb84d" />
    </linearGradient>

    <linearGradient id="tfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#844fba" />
      <stop offset="100%" stop-color="#602c99" />
    </linearGradient>

    <linearGradient id="k8sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#326ce5" />
      <stop offset="100%" stop-color="#00aaff" />
    </linearGradient>

    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="pipelineBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="nebulaAzure" cx="15%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaPurple" cx="85%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaAmber" cx="50%" cy="85%" r="35%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5" />
    </linearGradient>
    <!-- Pipeline Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
  </defs>

  <style>
    @keyframes flowPulse {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes packetMove1 {
      0% { cx: 120; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 1160; opacity: 0; }
    }
    @keyframes packetMove2 {
      0% { cx: 120; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { cx: 1160; opacity: 0; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes statusPulse {
      0%, 100% { r: 5; opacity: 1; }
      50% { r: 7.5; opacity: 0.6; }
    }
    @keyframes subtleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    @keyframes shimmer {
      0% { stop-color: #38bdf8; }
      50% { stop-color: #00f2fe; }
      100% { stop-color: #38bdf8; }
    }
    .flow-line {
      stroke-dasharray: 12, 8;
      animation: flowPulse 12s linear infinite;
    }
    .flow-line-reverse {
      stroke-dasharray: 8, 6;
      animation: flowPulse 9s linear infinite reverse;
    }
    .packet-1 {
      animation: packetMove1 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .packet-2 {
      animation: packetMove2 6s cubic-bezier(0.4, 0, 0.2, 1) 3s infinite;
    }
    .blinking-cursor {
      animation: blinkCursor 1s step-start infinite;
    }
    .pulse-dot {
      animation: statusPulse 2s ease-in-out infinite;
    }
    .floating-card {
      animation: subtleFloat 4s ease-in-out infinite;
    }
    .floating-card-alt {
      animation: subtleFloat 4.5s ease-in-out 1s infinite;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .font-mono {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1280" height="460" rx="16" fill="url(#bgGrad)" />
  <rect width="1280" height="460" rx="16" fill="url(#cyberGrid)" />

  <!-- Ambient Nebulas -->
  <circle cx="160" cy="120" r="260" fill="url(#nebulaAzure)" />
  <circle cx="1120" cy="140" r="240" fill="url(#nebulaPurple)" />
  <circle cx="640" cy="400" r="280" fill="url(#nebulaAmber)" />

  <!-- Tech Frame Borders & Accents -->
  <rect x="14" y="14" width="1252" height="432" rx="12" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.7" />
  
  <!-- Corner Tech Brackets -->
  <path d="M 14 36 L 14 14 L 36 14" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M 1266 36 L 1266 14 L 1244 14" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M 14 424 L 14 446 L 36 446" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M 1266 424 L 1266 446 L 1244 446" fill="none" stroke="#38bdf8" stroke-width="2.5" />

  <!-- TOP STATUS BAR / HUD -->
  <g transform="translate(42, 38)">
    <!-- Architecture Tag Pill -->
    <rect x="0" y="0" width="280" height="26" rx="13" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
    <circle cx="13" cy="13" r="4.5" fill="#38bdf8" />
    <circle cx="13" cy="13" r="8" fill="#38bdf8" fill-opacity="0.2" class="pulse-dot" />
    <text x="27" y="17" class="font-mono font-bold" font-size="11" fill="#7dd3fc" letter-spacing="1.2">SENIOR DEVSECOPS &amp; CLOUD</text>
  </g>

  <g transform="translate(860, 38)">
    <!-- Live Operational Status Badge -->
    <rect x="0" y="0" width="378" height="26" rx="13" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1" />
    <circle cx="14" cy="13" r="4.5" fill="#10b981" class="pulse-dot" />
    <text x="26" y="17" class="font-mono" font-size="10.5" fill="#a7f3d0" letter-spacing="0.8">
      ZERO-TRUST: <tspan font-weight="bold" fill="#34d399">ACTIVE</tspan>  |  DRIFT: <tspan font-weight="bold" fill="#34d399">0%</tspan>  |  UPTIME: <tspan font-weight="bold" fill="#34d399">99.99%</tspan>
    </text>
  </g>

  <!-- HERO SECTION: NAME & EXECUTIVE TITLES -->
  <g transform="translate(60, 115)">
    <!-- Primary Name -->
    <text x="0" y="0" class="font-sans" font-size="44" font-weight="900" fill="url(#primaryTextGrad)" letter-spacing="-0.5">
      SARVESH KUMAR MISHRA
    </text>
    
    <!-- Verified Senior Icon / Shield Badge beside Name -->
    <g transform="translate(650, -32)">
      <rect x="0" y="0" width="145" height="26" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" />
      <!-- Small shield -->
      <path d="M 12 6 L 19 9 L 19 15 C 19 19 12 21 12 21 C 12 21 5 19 5 15 L 5 9 Z" fill="#0284c7" />
      <path d="M 8 13 L 11 16 L 16 10" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      <text x="26" y="17" class="font-mono" font-size="10.5" font-weight="bold" fill="#e0f2fe">SR. DEVSECOPS</text>
    </g>

    <!-- Subtitle: Role & Core Focus -->
    <text x="2" y="32" class="font-sans" font-size="19" font-weight="600" fill="#94a3b8" letter-spacing="0.3">
      Senior DevSecOps &#8226; Terraform &#8226; CI/CD Pipelines &#8226; Kubernetes &#8226; Azure/AWS
    </text>

    <!-- Experience & Competency Badges -->
    <g transform="translate(2, 48)">
      <!-- Badge 1: 16+ Yrs IT -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="148" height="26" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
        <text x="10" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#c7d2fe">✦ 16+ Years Total IT</text>
      </g>

      <!-- Badge 2: 7+ Yrs DevSecOps -->
      <g transform="translate(156, 0)">
        <rect x="0" y="0" width="170" height="26" rx="6" fill="#042f2e" stroke="#14b8a6" stroke-width="1" />
        <text x="10" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#99f6e4">🛡️ 7+ Yrs DevSecOps</text>
      </g>

      <!-- Badge 3: Terraform & IaC -->
      <g transform="translate(334, 0)">
        <rect x="0" y="0" width="195" height="26" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="1" />
        <text x="10" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#d8b4fe">⚡ Terraform &amp; IaC Expert</text>
      </g>

      <!-- Badge 4: Kubernetes & CI/CD -->
      <g transform="translate(537, 0)">
        <rect x="0" y="0" width="225" height="26" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" />
        <text x="10" y="17" class="font-sans" font-size="11.5" font-weight="700" fill="#bae6fd">☸️ K8s, Docker &amp; Pipelines</text>
      </g>
    </g>
  </g>

  <!-- INTERACTIVE DEVSECOPS PIPELINE & CLOUD FLOW SHOWCASE -->
  <g transform="translate(50, 222)">
    <!-- Circuit Panel Container -->
    <rect x="0" y="0" width="1180" height="135" rx="12" fill="url(#cardBg)" stroke="url(#cardStroke)" stroke-width="1.2" />

    <!-- Panel Header -->
    <text x="24" y="24" class="font-mono font-bold" font-size="11" fill="#38bdf8" letter-spacing="1.5">
      END-TO-END AUTOMATED DEVSECOPS &amp; MULTI-CLOUD ARCHITECTURE PIPELINE
    </text>
    <text x="1060" y="24" class="font-mono" font-size="10" fill="#64748b" text-anchor="end">
      SHIFT-LEFT • ZERO-TRUST • IaC GOVERNED
    </text>

    <!-- Animated Connecting Pipeline Beam -->
    <line x1="80" y1="76" x2="1100" y2="76" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <line x1="80" y1="76" x2="1100" y2="76" stroke="url(#pipelineBeam)" stroke-width="4" stroke-linecap="round" class="flow-line" filter="url(#glowSoft)" />
    <line x1="1100" y1="76" x2="80" y2="76" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.4" class="flow-line-reverse" />

    <!-- Animated Data Packets Traveling on Pipeline -->
    <circle cx="80" cy="76" r="4.5" fill="#38bdf8" class="packet-1" filter="url(#glowCyan)" />
    <circle cx="80" cy="76" r="4" fill="#a855f7" class="packet-2" filter="url(#glowCyan)" />

    <!-- STAGE 1: CODE / GIT -->
    <g transform="translate(90, 76)">
      <circle cx="0" cy="0" r="25" fill="#0f172a" stroke="#f43f5e" stroke-width="2.2" />
      <!-- Git Branch Icon -->
      <path d="M -6 -10 C -6 -13 -3 -15 0 -15 C 3 -15 6 -13 6 -10 C 6 -7.5 4 -6.2 1.5 -5.8 L 1.5 5.8 C 4 6.2 6 7.5 6 10 C 6 13 3 15 0 15 C -3 15 -6 13 -6 10 C -6 7.5 -4 6.2 -1.5 5.8 L -1.5 -5.8 C -4 -6.2 -6 -7.5 -6 -10 Z" fill="#f43f5e" />
      <text x="0" y="42" class="font-sans font-bold" font-size="11" fill="#f1f5f9" text-anchor="middle">Git / Repos</text>
      <text x="0" y="54" class="font-mono" font-size="8.5" fill="#94a3b8" text-anchor="middle">Trunk-Based</text>
    </g>


    <!-- STAGE 2: IaC / TERRAFORM -->
    <g transform="translate(245, 76)">
      <circle cx="0" cy="0" r="25" fill="#0f172a" stroke="#844fba" stroke-width="2.2" />
      <!-- Terraform Icon Glyph -->
      <path d="M -9 -11 L -2 -7 L -2 3 L -9 -1 Z M 0 -6 L 7 -10 L 7 0 L 0 4 Z M 0 6 L 7 2 L 7 12 L 0 16 Z M -2 5 L -2 15 L -9 11 L -9 1 Z" fill="#a855f7" />
      <text x="0" y="42" class="font-sans font-bold" font-size="11" fill="#f1f5f9" text-anchor="middle">Terraform</text>
      <text x="0" y="54" class="font-mono" font-size="8.5" fill="#c084fc" text-anchor="middle">Modular Landing</text>
    </g>

    <!-- STAGE 3: SECURITY / SHIFT-LEFT -->
    <g transform="translate(415, 76)">
      <circle cx="0" cy="0" r="25" fill="#0f172a" stroke="#10b981" stroke-width="2.2" />
      <!-- Shield Icon Glyph -->
      <path d="M 0 -13 L 11 -7 L 11 3 C 11 9 0 14 0 14 C 0 14 -11 9 -11 3 L -11 -7 Z" fill="none" stroke="#10b981" stroke-width="2" />
      <path d="M -5 -1 L -1 3 L 6 -4" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
      <text x="0" y="42" class="font-sans font-bold" font-size="11" fill="#f1f5f9" text-anchor="middle">DevSecOps</text>
      <text x="0" y="54" class="font-mono" font-size="8.5" fill="#6ee7b7" text-anchor="middle">Checkov • Trivy</text>
    </g>

    <!-- STAGE 4: CI/CD & PIPELINE (JENKINS / AZURE PIPELINES) -->
    <g transform="translate(585, 76)">
      <circle cx="0" cy="0" r="25" fill="#0f172a" stroke="#0ea5e9" stroke-width="2.2" />
      <!-- Pipeline Gear / Play Icon -->
      <circle cx="0" cy="0" r="11" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4, 2" />
      <polygon points="-3,-5 6,0 -3,5" fill="#38bdf8" />
      <text x="0" y="42" class="font-sans font-bold" font-size="11" fill="#f1f5f9" text-anchor="middle">CI/CD Engine</text>
      <text x="0" y="54" class="font-mono" font-size="8.5" fill="#7dd3fc" text-anchor="middle">Jenkins • AzDevOps</text>
    </g>

    <!-- STAGE 5: CONTAINER PLATFORM (KUBERNETES) -->
    <g transform="translate(755, 76)">
      <circle cx="0" cy="0" r="25" fill="#0f172a" stroke="#326ce5" stroke-width="2.2" />
      <!-- K8s Wheel Glyph -->
      <polygon points="0,-12 11,-6 11,6 0,12 -11,6 -11,-6" fill="none" stroke="#60a5fa" stroke-width="1.8" />
      <circle cx="0" cy="0" r="4" fill="#60a5fa" />
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#60a5fa" stroke-width="1.4" />
      <line x1="-11" y1="-6" x2="11" y2="6" stroke="#60a5fa" stroke-width="1.4" />
      <line x1="-11" y1="6" x2="11" y2="-6" stroke="#60a5fa" stroke-width="1.4" />
      <text x="0" y="42" class="font-sans font-bold" font-size="11" fill="#f1f5f9" text-anchor="middle">Kubernetes</text>
      <text x="0" y="54" class="font-mono" font-size="8.5" fill="#93c5fd" text-anchor="middle">AKS • EKS • Helm</text>
    </g>

    <!-- STAGE 6: ENTERPRISE CLOUD (AZURE & AWS) -->
    <g transform="translate(925, 76)">
      <circle cx="0" cy="0" r="25" fill="#0f172a" stroke="#0078d4" stroke-width="2.2" />
      <!-- Cloud Outline Glyph -->
      <path d="M -8 4 A 7 7 0 0 1 -2 -4 A 8 8 0 0 1 10 -2 A 6 6 0 0 1 12 6 L -8 6 Z" fill="none" stroke="#38bdf8" stroke-width="2" />
      <path d="M 2 8 L 8 8" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
      <text x="0" y="42" class="font-sans font-bold" font-size="11" fill="#f1f5f9" text-anchor="middle">Azure &amp; AWS</text>
      <text x="0" y="54" class="font-mono" font-size="8.5" fill="#38bdf8" text-anchor="middle">Hub-Spoke • CAF</text>
    </g>

    <!-- STAGE 7: GOVERNANCE & FINOPS -->
    <g transform="translate(1085, 76)">
      <circle cx="0" cy="0" r="25" fill="#0f172a" stroke="#eab308" stroke-width="2.2" />
      <!-- FinOps / Telemetry Chart Glyph -->
      <path d="M -10 6 L -4 0 L 2 4 L 10 -6" fill="none" stroke="#facc15" stroke-width="2.2" stroke-linecap="round" />
      <circle cx="10" cy="-6" r="2.5" fill="#facc15" />
      <text x="0" y="42" class="font-sans font-bold" font-size="11" fill="#f1f5f9" text-anchor="middle">Monitoring</text>
      <text x="0" y="54" class="font-mono" font-size="8.5" fill="#fde047" text-anchor="middle">Azure Monitor • SRE</text>
    </g>
  </g>

  <!-- BOTTOM TERMINAL HUD & ARCHITECTURAL HIGHLIGHT -->
  <g transform="translate(50, 382)">
    <!-- Terminal Background -->
    <rect x="0" y="0" width="1180" height="50" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    
    <!-- Terminal Window Dots -->
    <circle cx="20" cy="25" r="5" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="36" cy="25" r="5" fill="#eab308" fill-opacity="0.8" />
    <circle cx="52" cy="25" r="5" fill="#22c55e" fill-opacity="0.8" />

    <!-- Command Prompt Content -->
    <text x="75" y="30" class="font-mono" font-size="12" fill="#94a3b8">
      <tspan fill="#38bdf8" font-weight="bold">sarvesh@devops-core</tspan>:<tspan fill="#a855f7">~/terraform-k8s</tspan>$ terraform apply -auto-approve 
      <tspan fill="#34d399" font-weight="bold">✔ Apply complete! 48 resources added, AKS cluster online, CI/CD gates: PASS, Drift: 0%</tspan>
    </text>
    <rect x="1035" y="19" width="8" height="15" fill="#38bdf8" class="blinking-cursor" />
  </g>
</svg>
