<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="stratBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c17" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="stratHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Node Gradient 1: Core -->
    <linearGradient id="nodeCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Node Gradient 2: Experienced -->
    <linearGradient id="nodeExp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Pattern -->
    <pattern id="stratGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
      @keyframes beamMove {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      .circuit-beam {
        stroke-dasharray: 8, 4;
        animation: beamMove 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="14" fill="url(#stratBg)" />
  <rect width="1200" height="380" rx="14" fill="url(#stratGrid)" />
  <rect x="10" y="10" width="1180" height="360" rx="12" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.7" />

  <!-- CONNECTING CIRCUIT LINES -->
  <!-- From Root to Portfolio -->
  <line x1="600" y1="56" x2="600" y2="82" stroke="#38bdf8" stroke-width="2" />

  <!-- From Portfolio to Branches -->
  <path d="M 600 120 L 600 138 L 220 138 L 220 156" fill="none" stroke="#64748b" stroke-width="2" />
  <path d="M 600 120 L 600 138 L 760 138 L 760 156" fill="none" stroke="#10b981" stroke-width="2.5" class="circuit-beam" />

  <!-- From Experienced to 5 Assets Bus -->
  <line x1="760" y1="202" x2="760" y2="230" stroke="#10b981" stroke-width="2" />
  <path d="M 140 230 L 1060 230" stroke="#38bdf8" stroke-width="2" class="circuit-beam" />
  <line x1="140" y1="230" x2="140" y2="252" stroke="#0284c7" stroke-width="2" />
  <line x1="370" y1="230" x2="370" y2="252" stroke="#2563eb" stroke-width="2" />
  <line x1="600" y1="230" x2="600" y2="252" stroke="#d97706" stroke-width="2" />
  <line x1="830" y1="230" x2="830" y2="252" stroke="#9333ea" stroke-width="2" />
  <line x1="1060" y1="230" x2="1060" y2="252" stroke="#059669" stroke-width="2" />

  <!-- ROOT NODE: HOW TO LOOK UNIQUE? -->
  <g transform="translate(420, 24)">
    <rect width="360" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
    <circle cx="16" cy="16" r="4.5" fill="#38bdf8" />
    <text x="180" y="21" class="font-sans font-bold" font-size="13" fill="#e0f2fe" text-anchor="middle" letter-spacing="1">
      🎯 HOW TO STAND OUT IN SENIOR HIRING?
    </text>
  </g>

  <!-- LEVEL 1: THE STRATEGIC PORTFOLIO -->
  <g transform="translate(460, 82)">
    <rect width="280" height="38" rx="8" fill="url(#nodeCore)" stroke="#818cf8" stroke-width="1.8" />
    <text x="140" y="24" class="font-sans font-bold" font-size="13.5" fill="#c7d2fe" text-anchor="middle">
      💼 Value-Driven Engineering Portfolio
    </text>
  </g>

  <!-- BRANCH 1: FRESHERS / STANDARD -->
  <g transform="translate(100, 156)">
    <rect width="240" height="46" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,2" />
    <text x="120" y="22" class="font-sans font-bold" font-size="12" fill="#94a3b8" text-anchor="middle">
      Standard Track / Early Career
    </text>
    <text x="120" y="38" class="font-mono" font-size="9.5" fill="#64748b" text-anchor="middle">
      Tool syntax &#8226; Academic labs &#8226; Tutorials
    </text>
  </g>

  <!-- BRANCH 2: EXPERIENCED SENIOR PROFESSIONAL (Sarvesh) -->
  <g transform="translate(560, 156)">
    <rect width="400" height="46" rx="8" fill="url(#nodeExp)" stroke="#10b981" stroke-width="2" />
    <circle cx="22" cy="23" r="5" fill="#34d399" />
    <text x="210" y="22" class="font-sans font-bold" font-size="13" fill="#a7f3d0" text-anchor="middle">
      Senior Professional Track (16+ Yrs IT &#8226; 7+ Yrs DevSecOps)
    </text>
    <text x="210" y="38" class="font-mono" font-size="10" fill="#6ee7b7" text-anchor="middle">
      Business ROI &#8226; Architecture Blueprints &#8226; Zero-Downtime Governance
    </text>
  </g>

  <!-- ================= 5 ESSENTIAL PILLARS (ROW OF CARDS) ================= -->
  <!-- CARD 1: RESUME -->
  <g transform="translate(30, 252)">
    <rect width="215" height="102" rx="8" fill="#0c2d48" stroke="#0284c7" stroke-width="1.8" />
    <rect x="12" y="10" width="22" height="22" rx="4" fill="#0369a1" />
    <text x="23" y="26" class="font-sans font-bold" font-size="13" fill="#38bdf8" text-anchor="middle">1</text>
    <text x="42" y="26" class="font-sans font-bold" font-size="13" fill="#f0f9ff">Impact Resume</text>
    <line x1="12" y1="38" x2="200" y2="38" stroke="#0284c7" stroke-width="1" stroke-opacity="0.5" />
    <text x="12" y="58" class="font-mono" font-size="10" fill="#7dd3fc">&gt; 100+ Workloads Migrated</text>
    <text x="12" y="74" class="font-mono" font-size="10" fill="#7dd3fc">&gt; 28% FinOps OPEX Saved</text>
    <text x="12" y="90" class="font-mono" font-size="10" fill="#94a3b8">&gt; Zero Downtime</text>
  </g>

  <!-- CARD 2: LINKEDIN -->
  <g transform="translate(262, 252)">
    <rect width="215" height="102" rx="8" fill="#172554" stroke="#2563eb" stroke-width="1.8" />
    <rect x="12" y="10" width="22" height="22" rx="4" fill="#1d4ed8" />
    <text x="23" y="26" class="font-sans font-bold" font-size="13" fill="#93c5fd" text-anchor="middle">2</text>
    <text x="42" y="26" class="font-sans font-bold" font-size="13" fill="#eff6ff">LinkedIn Voice</text>
    <line x1="12" y1="38" x2="200" y2="38" stroke="#2563eb" stroke-width="1" stroke-opacity="0.5" />
    <text x="12" y="58" class="font-mono" font-size="10" fill="#93c5fd">&gt; Thought Leadership</text>
    <text x="12" y="74" class="font-mono" font-size="10" fill="#93c5fd">&gt; Architecture Blueprints</text>
    <text x="12" y="90" class="font-mono" font-size="10" fill="#94a3b8">&gt; Industry Peer Network</text>
  </g>

  <!-- CARD 3: JOB PORTALS -->
  <g transform="translate(492, 252)">
    <rect width="215" height="102" rx="8" fill="#3b2306" stroke="#d97706" stroke-width="1.8" />
    <rect x="12" y="10" width="22" height="22" rx="4" fill="#b45309" />
    <text x="23" y="26" class="font-sans font-bold" font-size="13" fill="#fde68a" text-anchor="middle">3</text>
    <text x="42" y="26" class="font-sans font-bold" font-size="13" fill="#fffbeb">Targeted Portals</text>
    <line x1="12" y1="38" x2="200" y2="38" stroke="#d97706" stroke-width="1" stroke-opacity="0.5" />
    <text x="12" y="58" class="font-mono" font-size="10" fill="#fcd34d">&gt; DevSecOps &amp; Cloud</text>
    <text x="12" y="74" class="font-mono" font-size="10" fill="#fcd34d">&gt; CAF, Hub-Spoke, IaC</text>
    <text x="12" y="90" class="font-mono" font-size="10" fill="#94a3b8">&gt; High-Intent Keywords</text>
  </g>

  <!-- CARD 4: GITHUB REPO -->
  <g transform="translate(722, 252)">
    <rect width="215" height="102" rx="8" fill="#2e1065" stroke="#9333ea" stroke-width="1.8" />
    <rect x="12" y="10" width="22" height="22" rx="4" fill="#7e22ce" />
    <text x="23" y="26" class="font-sans font-bold" font-size="13" fill="#d8b4fe" text-anchor="middle">4</text>
    <text x="42" y="26" class="font-sans font-bold" font-size="13" fill="#faf5ff">GitHub Repos</text>
    <line x1="12" y1="38" x2="200" y2="38" stroke="#9333ea" stroke-width="1" stroke-opacity="0.5" />
    <text x="12" y="58" class="font-mono" font-size="10" fill="#d8b4fe">&gt; Reusable Terraform IaC</text>
    <text x="12" y="74" class="font-mono" font-size="10" fill="#d8b4fe">&gt; Hardened CI/CD Pipes</text>
    <text x="12" y="90" class="font-mono" font-size="10" fill="#94a3b8">&gt; Production Codeowners</text>
  </g>

  <!-- CARD 5: BLOG & ADRs -->
  <g transform="translate(952, 252)">
    <rect width="218" height="102" rx="8" fill="#042f2e" stroke="#059669" stroke-width="1.8" />
    <rect x="12" y="10" width="22" height="22" rx="4" fill="#047857" />
    <text x="23" y="26" class="font-sans font-bold" font-size="13" fill="#6ee7b7" text-anchor="middle">5</text>
    <text x="42" y="26" class="font-sans font-bold" font-size="13" fill="#f0fdf4">Case Studies &amp; ADRs</text>
    <line x1="12" y1="38" x2="200" y2="38" stroke="#059669" stroke-width="1" stroke-opacity="0.5" />
    <text x="12" y="58" class="font-mono" font-size="10" fill="#6ee7b7">&gt; Arch Decision Records</text>
    <text x="12" y="74" class="font-mono" font-size="10" fill="#6ee7b7">&gt; Real Post-Mortems</text>
    <text x="12" y="90" class="font-mono" font-size="10" fill="#94a3b8">&gt; Migration Strategies</text>
  </g>
</svg>
